# アンケート質問定義ファイル
# 質問の追加・変更・順序変更はこのファイルだけを編集する
#
# type    : single（単一選択） / multiple（複数選択）
# layout  : list（テキスト+アイコン縦リスト） / grid（アイコン+名称グリッドカード）
#
# showIf / hideIf による条件分岐:
#   showIf → 条件が満たされる場合のみ表示（デフォルト非表示）
#   hideIf → 条件が満たされる場合はスキップ（デフォルト表示）
#
# 【分岐フロー】
#   movement_mode（常に表示）
#     ├─ 自走式車椅子 / 電動車椅子
#     │    → upper_body_full（Q3）
#     │         ├─ いいえ → upper_body_partial（Q4）→ 確認画面
#     │         └─ はい  → limited_upper_body_situation（別途準備）→ 確認画面
#     ├─ 介助者 / ベビーカー / 2人乗りベビーカー / 小さいお子さん連れ / ペット連れ
#     │    → non_disability_situation（別途準備）→ 確認画面
#     ├─ 杖利用者 / シニアカー
#     │    → ambulatory_situation（別途準備）→ 確認画面
#     └─ その他 → 確認画面（追加質問なし）
#
# ※ YAML の記述順序 = 画面表示順序。showIf 条件が同じ質問は上から順に表示される。
#
# icon には Material Icons の名前を文字列で指定する。
# 使用可能なアイコン名は lib/data/survey_question_loader.dart の _iconMap を参照。

questions:
  # ──────────────────────────────────────────────────────────────
  # 移動のモード選択（常に表示・グリッド10択）
  # ──────────────────────────────────────────────────────────────
  - id: movement_mode
    label: 移動のモード
    question: 移動のモードを選択してください
    type: single
    layout: grid
    optionVisualSize: 28
    optionContainerSize: 52
    options:
      - value: 自走式車椅子
        icon: accessible
        color: "#1D9E75"
      - value: 電動車椅子
        icon: electric_bolt
        color: "#9C27B0"
      - value: 介助者
        icon: people
        color: "#378ADD"
      - value: 杖利用者
        icon: elderly
        color: "#EF9F27"
      - value: ベビーカー
        icon: baby_changing_station
        color: "#D85A30"
      - value: 2人乗りベビーカー
        icon: family_restroom
        color: "#378ADD"
      - value: 小さいお子さん連れ
        icon: child_care
        color: "#EF9F27"
      - value: シニアカー
        icon: electric_scooter
        color: "#6B6B6B"
      - value: ペット連れ
        icon: pets
        color: "#D85A30"
      - value: その他
        icon: more_horiz
        color: "#6B6B6B"

  # ──────────────────────────────────────────────────────────────
  # Q3: 上半身の可動性（自走式車椅子 / 電動車椅子 を選択した場合のみ）
  # ──────────────────────────────────────────────────────────────
  - id: upper_body_full
    label: 上半身の可動性
    question: 上半身全体を自由に動かせますか？
    type: single
    layout: list
    showIf:
      questionId: movement_mode
      containsAny:
        - 自走式車椅子
        - 電動車椅子
    options:
      - value: はい
        icon: check_circle_outline
        color: "#1D9E75"
      - value: いいえ
        icon: close
        color: "#D85A30"

  # ──────────────────────────────────────────────────────────────
  # 介助者・ベビーカー等 ブランチ（別途準備）
  # 介助者 / ベビーカー / 2人乗りベビーカー / 小さいお子さん連れ / ペット連れ
  # ──────────────────────────────────────────────────────────────
  - id: non_disability_situation
    label: ご利用の状況
    question: どのような状況でご利用ですか？
    description: "※詳細アンケートは準備中です"
    type: single
    layout: list
    showIf:
      questionId: movement_mode
      containsAny:
        - 介助者
        - ベビーカー
        - 2人乗りベビーカー
        - 小さいお子さん連れ
        - ペット連れ
    options:
      - value: ベビーカーを使用している
        icon: baby_changing_station
        color: "#378ADD"
      - value: 介助者と一緒に外出する
        icon: people
        color: "#1D9E75"
      - value: その他
        icon: more_horiz
        color: "#6B6B6B"

  # ──────────────────────────────────────────────────────────────
  # 杖利用者・シニアカー ブランチ（別途準備）
  # ──────────────────────────────────────────────────────────────
  - id: ambulatory_situation
    label: 移動補助の状況
    question: どのような方法で移動していますか？
    description: "※詳細アンケートは準備中です"
    type: single
    layout: list
    showIf:
      questionId: movement_mode
      containsAny:
        - 杖利用者
        - シニアカー
    options:
      - value: 杖を使用している
        icon: elderly
        color: "#EF9F27"
      - value: 歩行器を使用している
        icon: accessible_forward
        color: "#D85A30"
      - value: その他
        icon: more_horiz
        color: "#6B6B6B"

  # ──────────────────────────────────────────────────────────────
  # Q4: 上半身の部分的可動性（Q3=いいえ の場合のみ）→ 終端
  # ──────────────────────────────────────────────────────────────
  - id: upper_body_partial
    label: 上半身の動き
    question: 上半身は部分的に動く場所がありますか？
    type: single
    layout: list
    showIf:
      questionId: upper_body_full
      containsAny:
        - いいえ
    options:
      - value: 胴体は動かないが両腕なら自由に動く
        icon: accessible
        color: "#1D9E75"
      - value: 両腕が少しだけ動く
        icon: accessible
        color: "#378ADD"
      - value: 片腕なら動く
        icon: accessible
        color: "#EF9F27"
      - value: いいえ
        icon: close
        color: "#6B6B6B"

  # ──────────────────────────────────────────────────────────────
  # Q3=はい ブランチ: 車椅子スポーツ利用者など（別途準備）
  # ──────────────────────────────────────────────────────────────
  - id: limited_upper_body_situation
    label: 上半身の状況
    question: 上半身の機能について教えてください
    description: "※車椅子スポーツ利用者向けの詳細アンケートは準備中です"
    type: single
    layout: list
    showIf:
      questionId: upper_body_full
      containsAny:
        - はい
    options:
      - value: 車椅子スポーツを楽しんでいる
        icon: sports
        color: "#1D9E75"
      - value: 電動車椅子を使用している
        icon: accessible
        color: "#9C27B0"
      - value: その他
        icon: more_horiz
        color: "#6B6B6B"
